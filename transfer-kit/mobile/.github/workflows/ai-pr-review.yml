name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secret is configured
        env:
          KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::CURSOR_API_KEY secret is not set (repo Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: AI review — verdict gates the merge
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          agent -p "You are the pr-reviewer agent defined in .cursor/agents/pr-reviewer.md.
          Project laws live in .cursor/rules/ — apply them strictly.
          Event action: $EVENT_ACTION.
          - If it is 'synchronize' (a new push to an already-open PR): this is an
            INCREMENTAL review. Review in detail ONLY the new changes
            ('git diff $BEFORE_SHA..$AFTER_SHA'); then read your own previous
            review comments ('gh pr view $PR --comments') and check whether each
            earlier finding was addressed. Do NOT repeat old notes about
            unchanged code.
          - Otherwise (opened/reopened): review the FULL diff ('gh pr diff $PR').
          Explore any repository file you need for context.
          Your VERDICT always reflects the WHOLE PR state: previously flagged
          unresolved problems keep it NOT READY even if the new push is clean. You are READ-ONLY: never modify files,
          never push, never merge.
          Then: 1) post ONE review comment on the PR via
          'gh pr comment $PR --body-file <file you write>' summarizing findings
          (strengths, problems with file:line, missing tests);
          2) the comment AND your final output must end with exactly one line:
          VERDICT: READY   or   VERDICT: NOT READY.
          If the verdict is NOT READY, ALSO end the PR comment with a section
          titled '### Fix prompt — paste into Cursor' containing ONE fenced
          code block with a ready prompt that fixes exactly the issues you
          found (mention PR number, files, and what to change)." \
            -f --output-format text | tee review.log

          echo "----------------------------------------"
          if grep -q "VERDICT: NOT READY" review.log; then
            echo "::error::AI reviewer verdict: NOT READY — see the PR comment."
            exit 1
          elif grep -q "VERDICT: READY" review.log; then
            echo "AI reviewer verdict: READY"
          else
            echo "::error::No verdict found in reviewer output — failing safe."
            exit 1
          fi
