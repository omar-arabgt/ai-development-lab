name: Promotion Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [production]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: production only accepts staging
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "staging" ]; then
            echo "::error::PRs into 'production' may ONLY come from 'staging' (this one comes from '$HEAD')."
            exit 1
          fi
          echo "OK: staging -> production."
